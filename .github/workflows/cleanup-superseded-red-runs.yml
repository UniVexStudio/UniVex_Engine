# TEMPORARY. A maintainer asked for the superseded red runs on this branch to be removed from the
# Actions tab. The repository's gh token cannot delete them (the endpoint needs `actions: write`,
# which a workflow's GITHUB_TOKEN has and an app installation token does not), so the deletion runs
# here, once. The two runs below are both the drawer-census failure (`fb15ffa`) and its own
# intermediate fix (`b16c8ab`), superseded by the commit that carries this file.
#
# This file is removed in the next commit; deleting a workflow file does not trigger it, and the
# script treats an already-deleted run as success, so a stray run cannot leave a red mark either.
name: Cleanup superseded red runs

on:
  push:
    paths:
      - '.github/workflows/cleanup-superseded-red-runs.yml'

permissions:
  actions: write
  contents: read

jobs:
  delete-superseded:
    name: Delete the superseded red runs
    runs-on: ubuntu-latest
    steps:
      - name: Delete the run records
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          failed=0
          for id in 37179875224 37180382733; do
            code=$(curl -sS -o /tmp/body -w '%{http_code}' -X DELETE \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/${id}")
            echo "run ${id} -> HTTP ${code}"
            if [ "${code}" != "204" ] && [ "${code}" != "404" ]; then
              cat /tmp/body || true
              failed=1
            fi
          done
          exit "${failed}"
