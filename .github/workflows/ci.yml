#
# Everything this project checks, in one file. Three jobs, because there are three questions and
# they fail for different reasons:
#
#   build-and-test   Does the tree compile against real GL and Vulkan drivers, and do both GoogleTest
#                    suites pass? Green means the engine and the tests are sound, and says nothing
#                    about a build anybody can run.
#   windows-editor   Does the editor build as an actual Windows application, and does the exe start
#                    when you click it? A change nobody can download and open is a change nobody has
#                    really seen.
#   android-runtime  Does the apk put a picture on a device? Built for both ABIs, installed on an
#                    accelerated emulator, framebuffer read back. A different question from "does it
#                    compile", and the only place a black screen is answerable.
#
# One file rather than three, because three files meant three trigger lists, three sets of artifact
# switches and the same build written down more than once. A workflow is not a place to keep the
# project's history of splitting things up.
name: CI

# Two independent switches, and they mean different things.
#
# CREATE_ARTIFACTS (on by default) gates the two uploads that are builds somebody can try: the
# Windows editor package and the Android apks. Set the repository variable to 'false' to stop them,
# or pass create_artifacts=false on a manual run.
#
# DIAGNOSTIC_ARTIFACTS (off by default) gates the uploads that answer questions about a run instead
# of giving anybody something to run: the test log, the asset workload measurements and the editor
# process baseline. Nobody should pay for those on a change that has nothing to do with them.
env:
  UNIVEX_CREATE_ARTIFACTS: ${{ vars.CREATE_ARTIFACTS != 'false' }}
  UNIVEX_DIAGNOSTIC_ARTIFACTS: ${{ vars.DIAGNOSTIC_ARTIFACTS == 'true' }}

on:
  push:
    branches: [master, 'kosuke/**']
  pull_request:
  workflow_dispatch:
    inputs:
      create_artifacts:
        description: 'Create downloadable build and diagnostic artifacts (on by default)'
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------------------------
  # Linux: the tree compiles, and both GoogleTest suites pass, against real GL and Vulkan drivers.
  # Two modes, because a Debug build and a Sanitizers build fail differently.
  # ---------------------------------------------------------------------------------------------
  build-and-test:
    name: Ubuntu / GCC / ${{ matrix.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: Debug
            sanitizers: 'OFF'
          - mode: Sanitizers
            sanitizers: 'ON'
    env:
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install native dependencies
        # mesa-vulkan-drivers supplies lavapipe, the CPU Vulkan device the RHI tests
        # need; without it they skip and the Vulkan backend goes unverified.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            libglfw3-dev \
            libglew-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            zlib1g-dev \
            libjpeg-dev \
            xvfb \
            libvulkan1 \
            mesa-vulkan-drivers

      - name: Math boundary check
        run: python3 Engine/Tools/check_math_boundary.py

      - name: Engine vocabulary check
        # Ratchet on the vocabulary renames: a name this engine has retired cannot come back.
        # See the module docstring in the script and GODOT_STYLE_AUDIT.md for the policy.
        run: python3 Engine/Tools/check_engine_vocabulary.py

      - name: Panel include check
        # Every editor panel TU must include a standard header for each std:: facility it names,
        # instead of borrowing one transitively through imgui.h or a component header. Was 26
        # violations deep; triaged and clean, so it is enforced now.
        run: bash Engine/Tools/check_panel_includes.sh

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DUVE_BUILD_TESTS=ON -DUVE_ENABLE_SANITIZERS=${{ matrix.sanitizers }}

      - name: Build
        # pipefail keeps the step's exit status the compiler's, not tee's: the log is captured so
        # a failure can be echoed as an annotation below.
        run: |
          set -o pipefail
          cmake --build build --parallel "$(nproc)" 2>&1 | tee build-output.log

      - name: Cooked project and asset residency workload
        run: |
          build/Engine/Runtime/Pack/uve_asset_workload --create-fixture /tmp/uve-ci-cook-source
          build/Engine/Runtime/Pack/uve_pack --project /tmp/uve-ci-cook-source/sample.uvproject --runtime build/Engine/App/uve_runtime --output /tmp/uve-ci-cooked --cook android
          mv /tmp/uve-ci-cook-source /tmp/uve-ci-cook-source-unavailable
          python3 Engine/Tools/performance/measure_process.py --runs 3 --timeout 120 --output /tmp/uve-ci-asset-rss.json -- build/Engine/Runtime/Pack/uve_asset_workload /tmp/uve-ci-cooked/.uvassetdb /tmp/uve-ci-cooked /tmp/uve-ci-asset-load.json
          cd /tmp/uve-ci-cooked
          ./uve_runtime --headless --project sample.uvproject --frames 3

      - name: Surface build errors as annotations
        # Same reason the test step annotates failing case names: the job log and the artifact
        # blob host are not reachable from every network, and a failed check that says nothing is
        # worse than useless. Only the first 20 error lines are echoed - the log has the rest.
        if: failure()
        run: |
          python3 - <<'PY'
          import pathlib
          import sys

          path = pathlib.Path("build-output.log")
          if not path.exists():
              sys.exit(0)
          lines = [line.rstrip() for line in path.read_text(errors="replace").splitlines()]
          errors = [
              line
              for line in lines
              if "error:" in line or line.startswith("FAILED:") or "undefined reference" in line
          ]
          for line in errors[:20]:
              safe = line.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error::{safe[:900]}")
          print(f"::error::build failed with {len(errors)} captured error line(s)")
          PY

      - name: Test
        # Parallel, and both things that blocked it are fixed: every test process gets its own
        # working directory from Test/Support/test_scratch_uve.h, and ThreadPoolUVE now releases
        # a job's captured state before signalling completion, so a drained WaitUVE() no longer
        # leaves a worker holding the last reference to something it is about to outlive.
        #
        # On failure the failing case names are echoed as an annotation. The full story stays in
        # the job log and in the ctest-log artifact; the annotation exists because a failing check
        # should say WHAT broke without either being opened, and because annotations are readable
        # on restricted networks where the artifact/log blob host is not reachable.
        run: |
          set -o pipefail
          status=0
          xvfb-run -a ctest --test-dir build --output-on-failure -j"$(nproc)" 2>&1 | tee build/ctest-output.txt || status=$?
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          # The summary block is the reliable source: it lists every failing case whatever the
          # failure mode (Failed, Timeout, Exception, Subprocess aborted). The progress-line
          # markers are the fallback for a run that never reached the summary.
          awk '/^The following tests FAILED:/{flag=1; next} flag && /^[[:space:]]*[0-9]+ - /{print}' \
            build/ctest-output.txt \
            | sed -E 's/^[[:space:]]*[0-9]+ - //; s/[[:space:]]*\([^()]*\)[[:space:]]*$//' > build/failed-tests.txt
          if [ ! -s build/failed-tests.txt ]; then
            grep -E '\*\*\*(Failed|Timeout|Exception|Subprocess aborted)' build/ctest-output.txt \
              | sed -E 's/^[[:space:]]*[0-9]+\/[0-9]+[[:space:]]+Test[[:space:]]+#[0-9]+:[[:space:]]*//; s/[[:space:]]*\*\*\*.*$//; s/[.]+$//; s/[[:space:]]+$//' \
              > build/failed-tests.txt || true
          fi
          sort -u -o build/failed-tests.txt build/failed-tests.txt
          # One annotation per failing case, each carrying its own assertion. Artifact and log
          # downloads use a different host and are not reachable on every restricted network, so
          # what broke has to be legible from the Checks tab alone.
          python3 Engine/Tools/ci/annotate_ctest_failures.py build/ctest-output.txt
          count=$(( $(wc -l < build/failed-tests.txt) + 0 ))
          summary=$(paste -sd'; ' build/failed-tests.txt | cut -c1-3800)
          if [ "$count" -eq 0 ]; then
            echo "::error title=ctest failed (exit $status)::No '***Failed' line found in the ctest output; see the job log."
          else
            echo "::error title=$count failing test case(s)::${summary}"
          fi
          exit "$status"

      - name: Verify the Vulkan device tests actually ran
        # These cases skip themselves when no Vulkan device is present, which would leave
        # the backend untested while CI stayed green. Fail loudly if the runner loses it.
        working-directory: build
        run: |
          ./Test/uve_core_tests --gtest_filter='VulkanRenderDeviceUVETest.*' | tee /tmp/vulkan.log
          executed=$(grep -c '^\[       OK \] VulkanRenderDeviceUVETest' /tmp/vulkan.log)
          echo "Vulkan device cases executed: $executed"
          if [ "$executed" -lt 17 ]; then
            echo "::error::Only $executed Vulkan device cases ran (expected at least 17) - the runner has no working Vulkan driver."
            exit 1
          fi

      - name: Verify software OpenGL device tests actually ran
        working-directory: build
        run: |
          set -o pipefail
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a ./Test/uve_core_tests --gtest_filter='GlRenderDeviceUVETest.*' | tee /tmp/opengl.log
          executed=$(grep -c '^\[       OK \] GlRenderDeviceUVETest' /tmp/opengl.log)
          echo "OpenGL device cases executed: $executed"
          if [ "$executed" -lt 1 ]; then
            echo "::error::No software OpenGL device case ran; a capability skip is not native verification."
            exit 1
          fi
          if ! grep -Fq '[       OK ] GlRenderDeviceUVETest.BindGroupAppliesRealTextureSamplerAndBufferBindings' /tmp/opengl.log; then
            echo "::error::The native bind-group contract was not exercised."
            exit 1
          fi

      - name: Upload test log
        if: failure() && env.UNIVEX_DIAGNOSTIC_ARTIFACTS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ctest-log-${{ matrix.mode }}
          path: build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Validate process measurement runner
        run: python3 -m unittest discover -s Engine/Tools/performance -p 'test_*.py'

      - name: Validate the CI annotation helper
        # The step that explains a test failure is itself code: a parser that quietly stops
        # matching leaves a red build saying only "Process completed with exit code 8".
        run: python3 -m unittest discover -s Engine/Tools/ci -p 'test_*.py'

      - name: Record headless editor process baseline
        # Still a deliberate measurement, not something every pull request pays three minutes of
        # editor runtime for: the upload above turns artifacts on for everyone, this run does not.
        if: github.event_name == 'workflow_dispatch' && inputs.create_artifacts
        run: >-
          python3 Engine/Tools/performance/measure_process.py
          --runs 3 --timeout 60 --output build/editor-process-baseline.json
          -- build/Engine/App/uve_editor --headless --frames 300

      - name: Upload asset workload measurements
        if: always() && env.UNIVEX_DIAGNOSTIC_ARTIFACTS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: asset-workload-${{ matrix.mode }}
          path: |
            /tmp/uve-ci-asset-rss.json
            /tmp/uve-ci-asset-load.json
            /tmp/uve-ci-cooked/cooked.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload process baseline
        if: always() && env.UNIVEX_DIAGNOSTIC_ARTIFACTS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: editor-process-baseline-${{ matrix.mode }}
          path: build/editor-process-baseline.json
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------------------------
  # Windows: the editor is built as an actual Windows application, and the exe is started once with
  # a cooked project so the packaged DLLs are proven to be the ones it needs.
  # ---------------------------------------------------------------------------------------------
  windows-editor:
    name: Windows / Editor
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-glfw
            mingw-w64-ucrt-x86_64-glew
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-libjpeg-turbo
      - name: Configure editor
        shell: msys2 {0}
        run: >-
          cmake -S . -B build-windows -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DUVE_BUILD_TESTS=OFF
          -DUNIVEX_VIEWPORT_BUILD_TESTS=OFF
          -DUNIVEX_VIEWPORT_BUILD_APP=OFF
          -DUNIVEX_VIEWPORT_BUILD_TOOLS=OFF
      - name: Build editor
        shell: msys2 {0}
        run: cmake --build build-windows --target uve_editor_app uve_pack uve_runtime uve_asset_workload --parallel 4
      - name: Package editor and runtime DLLs
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p package/UniVex-Editor/Content/Viewport
          cp build-windows/Engine/App/uve_editor.exe package/UniVex-Editor/
          cp build-windows/Engine/App/uve_runtime.exe package/UniVex-Editor/
          cp build-windows/Engine/Runtime/Pack/uve_pack.exe package/UniVex-Editor/
          cp build-windows/Engine/Runtime/Pack/uve_asset_workload.exe package/UniVex-Editor/
          python - <<'PY'
          import pathlib
          import re
          import shutil
          import subprocess
          destination = pathlib.Path('package/UniVex-Editor')
          pending = list(destination.glob('*.exe'))
          copied = set()
          while pending:
              binary = pending.pop()
              imports = subprocess.check_output(['objdump', '-p', str(binary)], text=True)
              for name in re.findall(r'DLL Name:\s*(\S+)', imports):
                  key = name.lower()
                  source = pathlib.Path(shutil.which('g++')).parent / name
                  if key in copied or not source.is_file():
                      continue
                  copied.add(key)
                  target = destination / name
                  shutil.copy2(source, target)
                  pending.append(target)
          PY
          printf '@echo off\r\ncd /d "%%~dp0"\r\nuve_editor.exe\r\n' > package/UniVex-Editor/Start-Editor.bat
      - name: Verify executable starts
        shell: msys2 {0}
        run: |
          cd package/UniVex-Editor
          ./uve_editor.exe --bridge-stdio < /dev/null
          ./uve_asset_workload.exe --create-fixture ../cook-source
          ./uve_pack.exe --project ../cook-source/sample.uvproject --runtime ./uve_runtime.exe --output ../cooked --cook windows
          mv ../cook-source ../source-unavailable
          ../cooked/uve_runtime.exe --headless --project ../cooked/sample.uvproject --frames 3
      - uses: actions/upload-artifact@v4
        if: env.UNIVEX_CREATE_ARTIFACTS == 'true' &&
            (github.event_name != 'workflow_dispatch' || inputs.create_artifacts)
        with:
          name: UniVex-Editor-Windows-x64
          path: package/UniVex-Editor/
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------------------------
  # Android: two apks per ABI - the runtime's own touch-cube scene, and the same runtime with a
  # packed project - installed on an accelerated emulator, with the framebuffer read back. A black
  # screen here is a failed job instead of a phone that shows nothing.
  # ---------------------------------------------------------------------------------------------
  android-runtime:
    name: Android / ${{ matrix.abi }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    env:
      ANDROID_AVD_HOME: /tmp/univex-android-avds
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install pinned Android toolchain
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;29.0.14206865'

      - name: Build the demo apk
        # No --cooked-project on purpose: this is the build a person can install and immediately
        # see something in, without authoring a project first.
        run: >-
          python3 Engine/Tools/android/build_apk.py --sdk "$ANDROID_HOME"
          --build-dir /tmp/univex-android-demo --abi ${{ matrix.abi }} --jobs 2

      - name: Build the cooked apk
        # --native-build-dir reuses the library the step above just built, so this is packaging: the
        # asset index, aapt2, alignment and signing.
        run: >-
          python3 Engine/Tools/android/build_apk.py --sdk "$ANDROID_HOME"
          --build-dir /tmp/univex-android-cooked
          --native-build-dir /tmp/univex-android-demo/native
          --cooked-project Samples/CookedRuntimeSmoke/sample.uvproject
          --abi ${{ matrix.abi }} --jobs 2

      - name: Check both apks carry this abi's library
        # build_apk.py already verifies signature and alignment on the APK it writes. What it cannot
        # know is whether a stale staging directory produced an APK for the other ABI, which installs
        # cleanly and then fails at dlopen on a real phone - and the emulator job runs x86_64 only,
        # so it would never see the arm64 mistake.
        shell: bash
        run: |
          set -euo pipefail
          for variant in demo cooked; do
            apk="/tmp/univex-android-${variant}/univex-runtime-${{ matrix.abi }}.apk"
            test -f "${apk}"
            unzip -l "${apk}" | grep -q "lib/${{ matrix.abi }}/libunivex_android.so"
            echo "${variant}: $(stat -c%s "${apk}") bytes, lib/${{ matrix.abi }} present"
          done

      - name: Prepare the accelerated emulator
        if: matrix.abi == 'x86_64'
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
          sdkmanager 'emulator' 'system-images;android-29;default;x86_64'
          "$ANDROID_HOME/emulator/emulator" -no-window -no-audio -version
          "$ANDROID_HOME/emulator/emulator" -no-window -accel-check
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd --force --name univex-android --path "$ANDROID_AVD_HOME/univex-android.avd" --package 'system-images;android-29;default;x86_64'
          sed -i 's/^disk.dataPartition.size=.*/disk.dataPartition.size=2G/' "$ANDROID_AVD_HOME/univex-android.avd/config.ini"
          printf 'avd.ini.encoding=UTF-8\npath=/tmp/univex-android-avds/univex-android.avd\ntarget=android-29\n' > "$ANDROID_AVD_HOME/univex-android.ini"
          "$ANDROID_HOME/emulator/emulator" -no-window -list-avds | grep -Fx univex-android

      - name: Install and watch both apks on the emulator
        # Boot, install, smoke and shut down in one step on purpose: the emulator is a child of this
        # shell, and a later step would find it already dead. Both builds are smoked even when the
        # first one fails - "the demo is black but the cooked one renders" and its opposite are two
        # different bugs, and only running both tells them apart.
        #
        # Each smoke gets a second attempt, and only a second. A software-rendered emulator drops an
        # EGL surface or stalls a resume often enough that one failure is not evidence; two in a row
        # is, and the annotation from the first attempt says what happened either way.
        if: matrix.abi == 'x86_64'
        shell: bash
        run: |
          set -uo pipefail
          "$ANDROID_HOME/emulator/emulator" -avd univex-android -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader -memory 2048 -cores 2 > /tmp/univex-emulator.log 2>&1 &
          emulator_pid=$!
          trap 'adb -s emulator-5554 emu kill || true; kill "$emulator_pid" 2>/dev/null || true' EXIT
          if ! timeout 120 adb -s emulator-5554 wait-for-device; then
            cat /tmp/univex-emulator.log
            exit 1
          fi
          booted=false
          for attempt in $(seq 1 240); do
            if [ "$(adb -s emulator-5554 shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then
              booted=true
              break
            fi
            sleep 2
          done
          if [ "$booted" != true ]; then
            tail -60 /tmp/univex-emulator.log
            exit 1
          fi

          # The two apks are signed with the debug key of their own build directory, and Android
          # refuses to replace an installed package whose signing key changed - so the previous
          # variant has to go before the next one is installed.
          reset_device() {
            adb -s emulator-5554 shell am force-stop com.univex.runtime > /dev/null 2>&1 || true
            adb -s emulator-5554 uninstall com.univex.runtime > /dev/null 2>&1 || true
          }
          run_smoke() {
            local label="$1"
            local apk="$2"
            local attempt
            for attempt in 1 2; do
              if python3 Engine/Tools/android/smoke_runtime.py \
                  --adb "$ANDROID_HOME/platform-tools/adb" --serial emulator-5554 \
                  --apk "${apk}" --label "${label}" \
                  --report "/tmp/univex-android-${label}-smoke.json" \
                  --screenshot "/tmp/univex-android-${label}.png" "${@:3}"; then
                return 0
              fi
              echo "::warning title=${label} apk smoke::attempt ${attempt} failed"
              reset_device
              sleep 5
            done
            return 1
          }

          status=0
          # The demo has no project content, so a failure here is the runtime itself.
          run_smoke demo /tmp/univex-android-demo/univex-runtime-x86_64.apk || status=1
          reset_device
          # Same runtime, packed project. A failure here with a green demo is the content.
          run_smoke cooked /tmp/univex-android-cooked/univex-runtime-x86_64.apk \
            --expect-cooked-project --memory-report /tmp/univex-android-meminfo.txt || status=1

          # Dump the device log while the emulator is still alive; the trap above ends it.
          adb -s emulator-5554 logcat -d -s UniVex:V '*:S' > /tmp/univex-android-univex.txt 2>&1 || true
          adb -s emulator-5554 logcat -d > /tmp/univex-android-logcat.txt 2>&1 || true
          cat /tmp/univex-android-univex.txt || true
          exit "$status"

      - name: Upload the demo apk
        if: always() && env.UNIVEX_CREATE_ARTIFACTS == 'true' &&
            (github.event_name != 'workflow_dispatch' || inputs.create_artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: UniVex-Android-${{ matrix.abi }}-Demo
          path: /tmp/univex-android-demo/univex-runtime-${{ matrix.abi }}.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload the cooked apk
        if: always() && env.UNIVEX_CREATE_ARTIFACTS == 'true' &&
            (github.event_name != 'workflow_dispatch' || inputs.create_artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: UniVex-Android-${{ matrix.abi }}-Cooked
          path: /tmp/univex-android-cooked/univex-runtime-${{ matrix.abi }}.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload the smoke evidence
        # Uploaded even when the smoke failed - especially then: the screenshot of the black screen
        # and the logcat around it are the only things that explain it afterwards.
        if: always() && matrix.abi == 'x86_64' && env.UNIVEX_CREATE_ARTIFACTS == 'true' &&
            (github.event_name != 'workflow_dispatch' || inputs.create_artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: UniVex-Android-${{ matrix.abi }}-Smoke
          path: |
            /tmp/univex-android-demo-smoke.json
            /tmp/univex-android-cooked-smoke.json
            /tmp/univex-android-demo.png
            /tmp/univex-android-cooked.png
            /tmp/univex-android-meminfo.txt
            /tmp/univex-android-univex.txt
            /tmp/univex-android-logcat.txt
            /tmp/univex-emulator.log
          if-no-files-found: ignore
          retention-days: 7
