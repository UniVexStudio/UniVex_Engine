# Copyright (c) 2026 UniVex Studios. All Rights Reserved.
#
# Everything this project checks, in one file, in the order a person would ask about it.
#
#   build-and-test   Linux, GCC, CMake + Ninja. Compiles the whole tree against real GL and Vulkan
#                    drivers, runs every checker in Engine/Tools, then runs both GoogleTest suites
#                    in two modes: a Debug build, and a Sanitizers build that fails on the things a
#                    Debug build hides.
#   windows-editor   Windows, MSYS2 UCRT64, g++. Builds the editor as an actual Windows application,
#                    packages it with the DLLs its exes import, and starts those exes once so the
#                    package is proven to be the thing that runs - the same editor that runs on the
#                    laptop, built from the same tree.
#
# One file, because three files meant three trigger lists, three definitions of what CREATE_ARTIFACTS
# means, and the same checkout boilerplate written out three times. A workflow is not a place to keep
# the project's history of splitting things up.
#
# The Android apk is not in here. It is a runtime, not the editor - no project editing, no Inspector,
# nothing that works like the laptop does - and it is built deliberately, locally, with
# Engine/Tools/android/build_apk.py when somebody is working on mobile. Making every pull request pay
# half an hour of emulator time to watch a validation scene draw a cube was the wrong trade while the
# mobile runtime has no editor to be wrong about. The job is one `git log` away if that changes.
name: CI

# Two independent switches, and they mean different things.
#
# CREATE_ARTIFACTS (on by default) gates the upload that is a build somebody can try: the Windows
# editor package. Set the repository variable to 'false' to stop it, or pass create_artifacts=false
# on a manual run.
#
# DIAGNOSTIC_ARTIFACTS (off by default) gates the uploads that answer questions about a run instead
# of giving anybody something to run: the test log, the asset workload measurements and the editor
# process baseline. Nobody should pay for those on a change that has nothing to do with them.
env:
  UNIVEX_CREATE_ARTIFACTS: ${{ vars.CREATE_ARTIFACTS != 'false' }}
  UNIVEX_DIAGNOSTIC_ARTIFACTS: ${{ vars.DIAGNOSTIC_ARTIFACTS == 'true' }}

on:
  push:
    branches: [master, 'kosuke/**', 'refactor/**']
  pull_request:
  workflow_dispatch:
    inputs:
      create_artifacts:
        description: 'Create downloadable build and diagnostic artifacts (on by default)'
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------------------------
  # Linux: the tree compiles, and both GoogleTest suites pass, against real GL and Vulkan drivers.
  # Two modes, because a Debug build and a Sanitizers build fail differently.
  # ---------------------------------------------------------------------------------------------
  build-and-test:
    name: Ubuntu / GCC / ${{ matrix.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: Debug
            sanitizers: 'OFF'
    env:
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install native dependencies
        # mesa-vulkan-drivers supplies lavapipe, the CPU Vulkan device the RHI tests
        # need; without it they skip and the Vulkan backend goes unverified.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            libglfw3-dev \
            libglew-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            zlib1g-dev \
            libjpeg-dev \
            libfreetype-dev \
            xvfb \
            libvulkan1 \
            mesa-vulkan-drivers

      - name: Math boundary check
        run: python3 Engine/Tools/check_math_boundary.py

      - name: Engine vocabulary check
        # Ratchet on the vocabulary renames: a name this engine has retired cannot come back.
        # See the module docstring in the script and GODOT_STYLE_AUDIT.md for the policy.
        run: python3 Engine/Tools/check_engine_vocabulary.py

      - name: Panel include check
        # Every editor panel TU must include a standard header for each std:: facility it names,
        # instead of borrowing one transitively through imgui.h or a component header. Was 26
        # violations deep; triaged and clean, so it is enforced now.
        run: bash Engine/Tools/check_panel_includes.sh

      - name: Build with UVBT
        run: |
          set -o pipefail
          ./uvbt build UniVexTests Linux ${{ matrix.mode }} -j"$(nproc)" 2>&1 | tee build-output.log
          ./uvbt build UniVexRuntime Linux ${{ matrix.mode }} -j"$(nproc)" 2>&1 | tee -a build-output.log
          ./uvbt build UniVexPack Linux ${{ matrix.mode }} -j"$(nproc)" 2>&1 | tee -a build-output.log
          ./uvbt build UniVexAssetWorkload Linux ${{ matrix.mode }} -j"$(nproc)" 2>&1 | tee -a build-output.log
          ./uvbt build UniVexEditor Linux ${{ matrix.mode }} -j"$(nproc)" 2>&1 | tee -a build-output.log
          ./uvbt build UniVexPrismTests Linux ${{ matrix.mode }} -j"$(nproc)" 2>&1 | tee -a build-output.log

      - name: Cooked project and asset residency workload
        run: |
          ./.uvbt/bin/Linux/${{ matrix.mode }}/uve_asset_workload --create-fixture /tmp/uve-ci-cook-source
          ./.uvbt/bin/Linux/${{ matrix.mode }}/uve_pack --project /tmp/uve-ci-cook-source/sample.uvproject --runtime ./.uvbt/bin/Linux/${{ matrix.mode }}/uve_runtime --output /tmp/uve-ci-cooked --cook android
          mv /tmp/uve-ci-cook-source /tmp/uve-ci-cook-source-unavailable
          python3 Engine/Tools/performance/measure_process.py --runs 3 --timeout 120 --output /tmp/uve-ci-asset-rss.json -- ./.uvbt/bin/Linux/${{ matrix.mode }}/uve_asset_workload /tmp/uve-ci-cooked/.uvassetdb /tmp/uve-ci-cooked /tmp/uve-ci-asset-load.json
          cd /tmp/uve-ci-cooked
          ./uve_runtime --headless --project sample.uvproject --frames 3

      - name: Surface build errors as annotations
        if: failure()
        run: |
          python3 - <<'PY'
          import pathlib
          import sys

          path = pathlib.Path("build-output.log")
          if not path.exists():
              sys.exit(0)
          lines = [line.rstrip() for line in path.read_text(errors="replace").splitlines()]
          errors = [
              line
              for line in lines
              if "error:" in line or line.startswith("FAILED:") or "undefined reference" in line
          ]
          for line in errors[:20]:
              safe = line.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error::{safe[:900]}")
          print(f"::error::build failed with {len(errors)} captured error line(s)")
          PY

      - name: Test
        run: |
          set -o pipefail
          status=0
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a ./.uvbt/bin/Linux/${{ matrix.mode }}/UniVexTests 2>&1 | tee test-output.txt || status=$?
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          python3 Engine/Tools/ci/annotate_ctest_failures.py test-output.txt
          exit "$status"

      - name: PRISM UI tests
        # PRISM's own harness: unit checks, fuzzing and golden visual regression (tests/golden).
        run: ./.uvbt/bin/Linux/${{ matrix.mode }}/uve_prism_tests Engine/Runtime/Prism/assets

      - name: Verify the Vulkan device tests actually ran
        run: |
          ./.uvbt/bin/Linux/${{ matrix.mode }}/UniVexTests --gtest_filter='VulkanRenderDeviceUVETest.*' | tee /tmp/vulkan.log
          executed=$(grep -c '^\[       OK \] VulkanRenderDeviceUVETest' /tmp/vulkan.log)
          echo "Vulkan device cases executed: $executed"
          if [ "$executed" -lt 17 ]; then
            echo "::error::Only $executed Vulkan device cases ran (expected at least 17) - the runner has no working Vulkan driver."
            exit 1
          fi

      - name: PRISM editor shell starts
        # The PRISM Level Editor (uve_editor --prism-ui) renders a few frames on software GL and
        # saves its composited frame; the screenshot is uploaded for review.
        run: |
          mkdir -p /tmp/uve-prism-shell
          cd /tmp/uve-prism-shell
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1600x900x24" \
            "$GITHUB_WORKSPACE/.uvbt/bin/Linux/${{ matrix.mode }}/uve_editor" --prism-ui --prism-demo-object --frames 10 \
            --prism-screenshot /tmp/uve-prism-shell/prism_level_editor.png
          test -s /tmp/uve-prism-shell/prism_level_editor.png

      - name: Upload PRISM editor screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prism-level-editor-${{ matrix.mode }}
          path: /tmp/uve-prism-shell/prism_level_editor.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify software OpenGL device tests actually ran
        run: |
          set -o pipefail
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a ./.uvbt/bin/Linux/${{ matrix.mode }}/UniVexTests --gtest_filter='GlRenderDeviceUVETest.*' | tee /tmp/opengl.log
          executed=$(grep -c '^\[       OK \] GlRenderDeviceUVETest' /tmp/opengl.log)
          echo "OpenGL device cases executed: $executed"
          if [ "$executed" -lt 1 ]; then
            echo "::error::No software OpenGL device case ran; a capability skip is not native verification."
            exit 1
          fi
          if ! grep -Fq '[       OK ] GlRenderDeviceUVETest.BindGroupAppliesRealTextureSamplerAndBufferBindings' /tmp/opengl.log; then
            echo "::error::The native bind-group contract was not exercised."
            exit 1
          fi

      - name: Upload test log
        if: failure() && env.UNIVEX_DIAGNOSTIC_ARTIFACTS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-log-${{ matrix.mode }}
          path: test-output.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Validate process measurement runner
        run: python3 -m unittest discover -s Engine/Tools/performance -p 'test_*.py'

      - name: Validate the CI annotation helper
        run: python3 -m unittest discover -s Engine/Tools/ci -p 'test_*.py'

      - name: Record headless editor process baseline
        if: github.event_name == 'workflow_dispatch' && inputs.create_artifacts
        run: >-
          python3 Engine/Tools/performance/measure_process.py
          --runs 3 --timeout 60 --output editor-process-baseline.json
          -- ./.uvbt/bin/Linux/${{ matrix.mode }}/uve_editor --headless --frames 300

      - name: Upload asset workload measurements
        if: always() && env.UNIVEX_DIAGNOSTIC_ARTIFACTS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: asset-workload-${{ matrix.mode }}
          path: |
            /tmp/uve-ci-asset-rss.json
            /tmp/uve-ci-asset-load.json
            /tmp/uve-ci-cooked/cooked.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload process baseline
        if: always() && env.UNIVEX_DIAGNOSTIC_ARTIFACTS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: editor-process-baseline-${{ matrix.mode }}
          path: editor-process-baseline.json
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------------------------
  # Windows: the editor is built as an actual Windows application, and the exe is started once with
  # a cooked project so the packaged DLLs are proven to be the ones it needs.
  # ---------------------------------------------------------------------------------------------
  windows-editor:
    name: Windows / Editor
    runs-on: windows-latest
    # A full MinGW build of five targets on the 4-core runner takes about an hour on its own
    # (master's runs were cut off at 60 minutes too), so the job gets room to finish.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-glfw
            mingw-w64-ucrt-x86_64-glew
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-libjpeg-turbo
            mingw-w64-ucrt-x86_64-freetype
      - name: Build editor with UVBT
        shell: msys2 {0}
        run: |
          ./uvbt build UniVexEditor Windows Release -j4
          ./uvbt build UniVexRuntime Windows Release -j4
          ./uvbt build UniVexPack Windows Release -j4
          ./uvbt build UniVexAssetWorkload Windows Release -j4
          ./uvbt build UniVexPrismTests Windows Release -j4
      - name: Package editor and runtime DLLs
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p package/UniVex-Editor/Content/Viewport
          cp .uvbt/bin/Windows/Release/uve_editor.exe package/UniVex-Editor/
          cp .uvbt/bin/Windows/Release/uve_runtime.exe package/UniVex-Editor/
          cp .uvbt/bin/Windows/Release/uve_pack.exe package/UniVex-Editor/
          cp .uvbt/bin/Windows/Release/uve_asset_workload.exe package/UniVex-Editor/
          cp -r .uvbt/bin/Windows/Release/prism_assets package/UniVex-Editor/
          python - <<'PY'
          import pathlib
          import re
          import shutil
          import subprocess
          destination = pathlib.Path('package/UniVex-Editor')
          pending = list(destination.glob('*.exe'))
          copied = set()
          while pending:
              binary = pending.pop()
              imports = subprocess.check_output(['objdump', '-p', str(binary)], text=True)
              for name in re.findall(r'DLL Name:\s*(\S+)', imports):
                  key = name.lower()
                  source = pathlib.Path(shutil.which('g++')).parent / name
                  if key in copied or not source.is_file():
                      continue
                  copied.add(key)
                  target = destination / name
                  shutil.copy2(source, target)
                  pending.append(target)
          PY
          printf '@echo off\r\ncd /d "%%~dp0"\r\nuve_editor.exe\r\n' > package/UniVex-Editor/Start-Editor.bat
      - name: PRISM UI tests
        shell: msys2 {0}
        run: ./.uvbt/bin/Windows/Release/uve_prism_tests.exe Engine/Runtime/Prism/assets
      - name: Verify executable starts
        shell: msys2 {0}
        run: |
          cd package/UniVex-Editor
          ./uve_editor.exe --bridge-stdio < /dev/null
          ./uve_asset_workload.exe --create-fixture ../cook-source
          ./uve_pack.exe --project ../cook-source/sample.uvproject --runtime ./uve_runtime.exe --output ../cooked --cook windows
          mv ../cook-source ../source-unavailable
          ../cooked/uve_runtime.exe --headless --project ../cooked/sample.uvproject --frames 3
      - name: Upload the Windows editor package
        uses: actions/upload-artifact@v4
        if: env.UNIVEX_CREATE_ARTIFACTS == 'true' &&
            (github.event_name != 'workflow_dispatch' || inputs.create_artifacts)
        with:
          name: UniVex-Editor-Windows-x64
          path: package/UniVex-Editor/
          if-no-files-found: error
          retention-days: 7
