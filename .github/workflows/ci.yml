# Copyright (c) 2026 UniVex Studios. All Rights Reserved.
#
# Everything this project checks and releases, in one file, in the order a person would ask about it.
#
#   Ubuntu / GCC         Debug. The source checkers in Engine/Tools, the whole tree, a cooked-project
#                        smoke test, UniVexTests (against real software GL and Vulkan drivers) and
#                        PRISM's own test harness.
#   Hub / Linux          UniVex Hub and its installer, Release.
#   Hub / Windows        The same as Windows applications (MSYS2 UCRT64, g++).
#   Hub / Android        The Hub's APK, built with the NDK.
#   Release / Linux      The engine (editor, runtime, packer), Release.
#   Release / Windows    The same on Windows; the staged editor is started once so its DLLs are proven.
#   Release / Android    The engine for Android (the runtime until the editor runs there).
#   Publish the release  Release only, after everything above passed: one GitHub Release.
#
# Every job builds on every push, so breakage on any platform shows up with the change that caused
# it. On a release each job also packages what it built - nothing is compiled twice - and Publish puts
# the engine packages, the Hub installers and the Hub APK, each with its .sha256, into one release.
#
# Two kinds of release, both made by the same jobs:
#
#   every push to master  A development build: published to the development repository as the
#                         prerelease v<engine version>-beta, its files replaced by each later push of
#                         the same version.
#   a tag v<version>      A versioned release (e.g. v0.2.0, v0.2.0-beta). Tags ending in -beta are
#                         prereleases, the Hub's Beta channel.
#
# The engine's version comes from the tag, or from the built editor for master; the Hub's version is
# always read from the Hub that was built. Other branches are checked through pull requests.
#
# Where a release goes is switched by the PUBLISH_RELEASES repository variable:
#
#   not "true" (default)  The development repository in DEV_RELEASES_REPOSITORY below (a repository
#                         variable of the same name overrides it). The Hub never reads it: builds from
#                         there are installed with the Hub's "Import package...".
#   "true"                Tag releases go to the repository Engine/Distribution/engine_feed.json
#                         names, the one the Hub reads to offer engine versions. Master builds always
#                         go to the development repository.
#
# Publishing needs the RELEASES_TOKEN secret: a fine-grained access token with Contents: write on
# those two repositories only. An APK is signed with the key in the ANDROID_KEYSTORE secret (base64,
# with ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS) when it is set, so installed copies update in
# place; otherwise with a throwaway debug key. Only a public release refuses to ship without it.
#
# Every build compiles through ccache (UVBT_COMPILER_LAUNCHER) with the cache kept between runs, so a
# run recompiles only what changed since the last one instead of the whole tree.
#
# CI hands out no builds of its own: the only uploads are the release hand-over between jobs (deleted
# once published) and, when the DIAGNOSTIC_ARTIFACTS variable is 'true', the test log of a failed run.
name: CI

env:
  UNIVEX_DIAGNOSTIC_ARTIFACTS: ${{ vars.DIAGNOSTIC_ARTIFACTS == 'true' }}
  ENGINE_FEED_FILE: Engine/Distribution/engine_feed.json
  DEV_RELEASES_REPOSITORY: ${{ vars.DEV_RELEASES_REPOSITORY || 'UniVexStudio/UniVexReleases-Dev' }}
  # True for a run that publishes: a push to master (a development build) or a version tag.
  IS_RELEASE: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/master') || startsWith(github.ref, 'refs/tags/v') }}

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # A newer push replaces a running check, never a running release.
  cancel-in-progress: ${{ !((github.event_name == 'push' && github.ref == 'refs/heads/master') || startsWith(github.ref, 'refs/tags/v')) }}

jobs:
  # ---------------------------------------------------------------------------------------------
  # Linux: the checks pass, the tree builds in Debug, and the tests pass against real GL and Vulkan
  # drivers.
  # ---------------------------------------------------------------------------------------------
  linux:
    name: Ubuntu / GCC
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: Debug
            sanitizers: 'OFF'
    env:
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      UVBT_COMPILER_LAUNCHER: ccache
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 3G

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Restore the compiler cache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-linux-${{ matrix.mode }}-${{ github.sha }}
          restore-keys: ccache-linux-${{ matrix.mode }}-

      - name: Install native dependencies
        # mesa-vulkan-drivers supplies lavapipe, the CPU Vulkan device the RHI tests
        # need; without it they skip and the Vulkan backend goes unverified.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            libglfw3-dev \
            libglew-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            zlib1g-dev \
            libjpeg-dev \
            libfreetype-dev \
            libcurl4-openssl-dev \
            xvfb \
            libvulkan1 \
            mesa-vulkan-drivers \
            ccache

      - name: Math boundary check
        run: python3 Engine/Tools/check_math_boundary.py

      - name: Engine vocabulary check
        # Ratchet on the vocabulary renames: a name this engine has retired cannot come back.
        # See the module docstring in the script and GODOT_STYLE_AUDIT.md for the policy.
        run: python3 Engine/Tools/check_engine_vocabulary.py

      - name: Panel include check
        # Every editor panel TU must include a standard header for each std:: facility it names,
        # instead of borrowing one transitively through a UI header or a component header. Was 26
        # violations deep; triaged and clean, so it is enforced now.
        run: bash Engine/Tools/check_panel_includes.sh

      - name: Build with UVBT
        run: |
          set -o pipefail
          ccache -z
          ./uvbt build UniVexTests Linux ${{ matrix.mode }} -j"$(nproc)" 2>&1 | tee build-output.log
          ./uvbt build UniVexRuntime Linux ${{ matrix.mode }} -j"$(nproc)" 2>&1 | tee -a build-output.log
          ./uvbt build UniVexPack Linux ${{ matrix.mode }} -j"$(nproc)" 2>&1 | tee -a build-output.log
          ./uvbt build UniVexAssetWorkload Linux ${{ matrix.mode }} -j"$(nproc)" 2>&1 | tee -a build-output.log
          ./uvbt build UniVexEditor Linux ${{ matrix.mode }} -j"$(nproc)" 2>&1 | tee -a build-output.log
          ./uvbt build UniVexHub Linux ${{ matrix.mode }} -j"$(nproc)" 2>&1 | tee -a build-output.log
          ./uvbt build UniVexHubSetup Linux ${{ matrix.mode }} -j"$(nproc)" 2>&1 | tee -a build-output.log
          ./uvbt build UniVexPrismTests Linux ${{ matrix.mode }} -j"$(nproc)" 2>&1 | tee -a build-output.log
          ccache -s

      - name: Save the compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-linux-${{ matrix.mode }}-${{ github.sha }}

      - name: Cooked project smoke test & RSS budget gate
        run: |
          ./.uvbt/bin/Linux/${{ matrix.mode }}/uve_asset_workload --create-fixture /tmp/uve-ci-cook-source
          ./.uvbt/bin/Linux/${{ matrix.mode }}/uve_pack --project /tmp/uve-ci-cook-source/sample.uvproject --runtime ./.uvbt/bin/Linux/${{ matrix.mode }}/uve_runtime --output /tmp/uve-ci-cooked --cook android
          mv /tmp/uve-ci-cook-source /tmp/uve-ci-cook-source-unavailable
          ./.uvbt/bin/Linux/${{ matrix.mode }}/uve_asset_workload /tmp/uve-ci-cooked/.uvassetdb /tmp/uve-ci-cooked /tmp/uve-ci-asset-load.json
          cd /tmp/uve-ci-cooked
          ./uve_runtime --headless --project sample.uvproject --frames 3
          cd "${{ github.workspace }}"
          python3 Engine/Tools/performance/measure_process.py --runs 2 --timeout 30 --max-peak-mib 512 --output /tmp/uve-ci-runtime-perf.json -- /tmp/uve-ci-cooked/uve_runtime --headless --project /tmp/uve-ci-cooked/sample.uvproject --frames 3

      - name: Surface build errors as annotations
        if: failure()
        run: |
          python3 - <<'PY'
          import pathlib
          import sys

          path = pathlib.Path("build-output.log")
          if not path.exists():
              sys.exit(0)
          lines = [line.rstrip() for line in path.read_text(errors="replace").splitlines()]
          errors = [
              line
              for line in lines
              if "error:" in line or line.startswith("FAILED:") or "undefined reference" in line
          ]
          for line in errors[:20]:
              safe = line.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error::{safe[:900]}")
          print(f"::error::build failed with {len(errors)} captured error line(s)")
          PY

      - name: Test
        run: |
          set -o pipefail
          status=0
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a ./.uvbt/bin/Linux/${{ matrix.mode }}/UniVexTests 2>&1 | tee test-output.txt || status=$?
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          python3 Engine/Tools/ci/annotate_ctest_failures.py test-output.txt
          exit "$status"

      - name: PRISM UI tests
        # PRISM's own harness: unit checks, fuzzing and golden visual regression (tests/golden).
        run: ./.uvbt/bin/Linux/${{ matrix.mode }}/uve_prism_tests Engine/Runtime/Prism/assets

      - name: Verify the Vulkan device tests actually ran
        run: |
          ./.uvbt/bin/Linux/${{ matrix.mode }}/UniVexTests --gtest_filter='VulkanRenderDeviceUVETest.*' | tee /tmp/vulkan.log
          executed=$(grep -c '^\[       OK \] VulkanRenderDeviceUVETest' /tmp/vulkan.log)
          echo "Vulkan device cases executed: $executed"
          if [ "$executed" -lt 17 ]; then
            echo "::error::Only $executed Vulkan device cases ran (expected at least 17) - the runner has no working Vulkan driver."
            exit 1
          fi

      - name: Verify software OpenGL device tests actually ran
        run: |
          set -o pipefail
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a ./.uvbt/bin/Linux/${{ matrix.mode }}/UniVexTests --gtest_filter='GlRenderDeviceUVETest.*' | tee /tmp/opengl.log
          executed=$(grep -c '^\[       OK \] GlRenderDeviceUVETest' /tmp/opengl.log)
          echo "OpenGL device cases executed: $executed"
          if [ "$executed" -lt 1 ]; then
            echo "::error::No software OpenGL device case ran; a capability skip is not native verification."
            exit 1
          fi
          if ! grep -Fq '[       OK ] GlRenderDeviceUVETest.BindGroupAppliesRealTextureSamplerAndBufferBindings' /tmp/opengl.log; then
            echo "::error::The native bind-group contract was not exercised."
            exit 1
          fi

      - name: Upload test log
        if: failure() && env.UNIVEX_DIAGNOSTIC_ARTIFACTS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-log-${{ matrix.mode }}
          path: test-output.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Validate process measurement runner
        run: python3 -m unittest discover -s Engine/Tools/performance -p 'test_*.py'

      - name: Validate the CI annotation helper
        run: python3 -m unittest discover -s Engine/Tools/ci -p 'test_*.py'

      - name: Validate the engine and installer packagers
        run: |
          python3 -m unittest discover -s Engine/Tools -p 'test_*_installer.py'
          python3 -m unittest discover -s Engine/Tools -p 'test_package_engine.py'
          python3 -m unittest discover -s Engine/Tools -p 'test_shared_names.py'
          python3 -m unittest discover -s Engine/Tools -p 'test_uvbt.py'

  # ---------------------------------------------------------------------------------------------
  # Hub / <platform>: UniVex Hub and its installer. Built on every push; packaged on a release.
  # ---------------------------------------------------------------------------------------------
  hub-linux:
    name: Hub / Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      hub-version: ${{ steps.version.outputs.hub-version }}
    env:
      UVBT_COMPILER_LAUNCHER: ccache
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 3G
    steps:
      - uses: actions/checkout@v5
      - name: Restore the compiler cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .ccache
            .uvbt/tp_lib/Linux
          key: ccache-linux-hub-${{ hashFiles('Engine/Tools/UVBT/uvbt.py') }}-${{ github.sha }}
          restore-keys: ccache-linux-hub-${{ hashFiles('Engine/Tools/UVBT/uvbt.py') }}-
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libglfw3-dev libglew-dev libgl1-mesa-dev \
            libglu1-mesa-dev zlib1g-dev libjpeg-dev libfreetype-dev libcurl4-openssl-dev patchelf xvfb ccache \
            libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev libxmu-dev libbz2-dev
      - name: Build
        run: |
          set -euo pipefail
          ccache -z
          ./uvbt build UniVexHub Linux Release -j"$(nproc)"
          # Build the single-file setup executable with static UI libs so it runs on any Linux distro.
          UVBT_STATIC_LINUX_UI=1 ./uvbt build UniVexHubSetup Linux Release -j"$(nproc)"
          ccache -s
      - name: Save the compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .ccache
            .uvbt/tp_lib/Linux
          key: ccache-linux-hub-${{ hashFiles('Engine/Tools/UVBT/uvbt.py') }}-${{ github.sha }}
      - name: Read the Hub's version
        id: version
        run: echo "hub-version=$(.uvbt/bin/Linux/Release/uve_hub --version)" >> "${GITHUB_OUTPUT}"
      # Packaged and smoke-tested on every run so the shipped Linux installer and .deb are always verified.
      - name: Package the installer
        run: |
          python3 Engine/Tools/make_hub_installer.py --bin .uvbt/bin/Linux/Release --target linux \
            --tag "hub-v${{ steps.version.outputs.hub-version }}" --output dist --deb
      - name: Verify, install, launch and uninstall the Linux Hub
        run: |
          set -euo pipefail
          installer=$(ls dist/UniVexHubSetup-*-linux)
          ldd "${installer}" | tee /tmp/hub-setup-ldd.txt
          if grep -Eq 'not found|libglfw|libGLEW|libjpeg|libfreetype' /tmp/hub-setup-ldd.txt; then
            echo "::error::UniVexHubSetup carries non-portable shared library dependencies."
            exit 1
          fi
          install_dir="${RUNNER_TEMP}/UniVexHubLinuxTest"
          home_dir="${RUNNER_TEMP}/UniVexHubLinuxHome"
          mkdir -p "${home_dir}"
          HOME="${home_dir}" "${installer}" --silent --install-dir "${install_dir}"
          ldd "${install_dir}/uve_hub" | tee /tmp/hub-installed-ldd.txt
          if grep -q 'not found' /tmp/hub-installed-ldd.txt; then
            echo "::error::Installed uve_hub has unresolved shared libraries."
            exit 1
          fi
          HOME="${home_dir}" "${install_dir}/uve_hub" --version
          HOME="${home_dir}" LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a "${install_dir}/uve_hub" --frames 3
          HOME="${home_dir}" "${install_dir}/uve_hub_setup" --uninstall --silent --install-dir "${install_dir}"
          if [ -e "${install_dir}/uve_hub" ]; then
            echo "::error::Linux Hub uninstall left uve_hub behind."
            exit 1
          fi
          deb=$(ls dist/UniVexHub-*-linux-amd64.deb)
          dpkg-deb --info "${deb}"
          dpkg-deb --contents "${deb}" | grep -q 'usr/share/applications/univex-hub.desktop'
          deb_root="${RUNNER_TEMP}/UniVexHubDebTest"
          rm -rf "${deb_root}" && mkdir -p "${deb_root}"
          dpkg-deb -x "${deb}" "${deb_root}"
          grep -q '^Terminal=false$' "${deb_root}/usr/share/applications/univex-hub.desktop"
          ldd "${deb_root}/opt/univex-hub/uve_hub" | tee /tmp/hub-deb-ldd.txt
          if grep -q 'not found' /tmp/hub-deb-ldd.txt; then
            echo "::error::Debian package uve_hub has unresolved shared libraries."
            exit 1
          fi
          HOME="${home_dir}" "${deb_root}/opt/univex-hub/uve_hub" --version
          HOME="${home_dir}" LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a "${deb_root}/opt/univex-hub/uve_hub" --frames 3
      - name: Hand the release files to the publish job
        if: env.IS_RELEASE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: hub-linux
          path: dist/
          if-no-files-found: error
          retention-days: 7

  hub-windows:
    name: Hub / Windows
    runs-on: windows-latest
    # Windows minutes count double and Android builds and the emulator are long: a pull request is
    # checked on Linux, and these run on master, version tags and by hand.
    if: github.event_name != 'pull_request'
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-glfw
            mingw-w64-ucrt-x86_64-glew
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-libjpeg-turbo
            mingw-w64-ucrt-x86_64-freetype
            mingw-w64-ucrt-x86_64-ccache
      - name: Restore the compiler cache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-windows-hub-${{ github.sha }}
          restore-keys: ccache-windows-hub-
      - name: Build
        shell: msys2 {0}
        env:
          UVBT_COMPILER_LAUNCHER: ccache
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_COMPILERCHECK: content
          CCACHE_MAXSIZE: 3G
        run: |
          set -euo pipefail
          ccache -z
          # The Windows installer is an Inno Setup wizard (make_hub_installer.py), so only the Hub is built.
          ./uvbt build UniVexHub Windows Release -j4
          ccache -s
      - name: Save the compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-windows-hub-${{ github.sha }}
      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --yes --no-progress
            $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe" | Select-Object -First 1
          }
          if (-not $iscc) { Write-Error "Inno Setup's ISCC.exe was not found after installing it"; exit 1 }
          "UVE_ISCC=$($iscc.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      # Packaged on every run, so the check below proves the installer a release would ship.
      - name: Package the installer
        shell: msys2 {0}
        run: |
          set -euo pipefail
          bin=.uvbt/bin/Windows/Release
          objdump -p "$bin/uve_hub.exe" | grep -q 'Subsystem.*Windows GUI'
          hub_version=$("$bin/uve_hub.exe" --version | tr -d '\r')
          python Engine/Tools/make_hub_installer.py --bin "$bin" --target windows --tag "hub-v${hub_version}" --output dist
      # Installs silently with nothing but Windows itself on PATH (no MSYS2 libraries to hide a DLL the
      # installer forgot), starts the installed Hub, then uninstalls.
      - name: Install, start and uninstall the Hub
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist\UniVexHubSetup-*-windows.exe | Select-Object -First 1
          $target = Join-Path $env:RUNNER_TEMP "UniVexHubInstall"
          $log = Join-Path $env:RUNNER_TEMP "UniVexHubSetup.log"
          $setup = Start-Process -FilePath $installer.FullName -Wait -PassThru `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/DIR=`"$target`"", "/LOG=`"$log`""
          if ($setup.ExitCode -ne 0) { Get-Content $log; Write-Error "setup exited with $($setup.ExitCode)"; exit 1 }
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $version = & (Join-Path $target "uve_hub.exe") --version
          if ($LASTEXITCODE -ne 0 -or -not $version) { Write-Error "the installed Hub did not start (exit $LASTEXITCODE)"; exit 1 }
          Write-Output "Installed Hub reports version $version"
          $uninstaller = Get-ChildItem (Join-Path $target "unins*.exe") | Select-Object -First 1
          $removal = Start-Process -FilePath $uninstaller.FullName -Wait -PassThru -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
          if ($removal.ExitCode -ne 0) { Write-Error "uninstall exited with $($removal.ExitCode)"; exit 1 }
          # The uninstaller hands over to a copy of itself in the temporary folder and returns at once.
          $deadline = (Get-Date).AddSeconds(120)
          while ((Test-Path (Join-Path $target "uve_hub.exe")) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 2 }
          if (Test-Path (Join-Path $target "uve_hub.exe")) { Write-Error "uninstall left the Hub behind"; exit 1 }
      - name: Hand the release files to the publish job
        if: env.IS_RELEASE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: hub-windows
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # The NDK and SDK pieces are the versions UVBT and build_apk.py name.
  hub-android:
    name: Hub / Android
    runs-on: ubuntu-latest
    # Windows minutes count double and Android builds and the emulator are long: a pull request is
    # checked on Linux, and these run on master, version tags and by hand.
    if: github.event_name != 'pull_request'
    timeout-minutes: 90
    env:
      # The emulator the Hub is started on: an x86_64 system image (runs under KVM) of a recent Android.
      EMULATOR_ABI: x86_64
      EMULATOR_API_LEVEL: 34
      UVBT_COMPILER_LAUNCHER: ccache
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 3G
    steps:
      - uses: actions/checkout@v5
      - name: Restore the compiler cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .ccache
            .uvbt/tp_lib/Android
            ThirdParty/android
          key: android-hub-${{ hashFiles('Engine/Tools/UVBT/uvbt.py') }}-${{ github.sha }}
          restore-keys: android-hub-${{ hashFiles('Engine/Tools/UVBT/uvbt.py') }}-
      - name: Install the Android SDK pieces
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build ccache
          packages=$(python3 - <<'PY'
          import sys
          sys.path.insert(0, "Engine/Tools/android")
          import build_apk
          print(f"ndk;{build_apk.uvbt.ANDROID_NDK_VERSION} build-tools;{build_apk.ANDROID_BUILD_TOOLS} "
                f"platforms;{build_apk.ANDROID_PLATFORM}")
          PY
          )
          # `yes` ends with a broken pipe once the licenses are accepted; that is not a failure.
          (yes || true) | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ${packages}
      - name: Build the Hub APK
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          # Only a public release must carry the real key; development builds fall back to a debug key.
          PUBLIC_RELEASE: ${{ vars.PUBLISH_RELEASES == 'true' && startsWith(github.ref, 'refs/tags/v') }}
          UVE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          UVE_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          ccache -z
          signing=()
          if [ -n "${ANDROID_KEYSTORE}" ]; then
            # Pasted base64 often carries line breaks, spaces or a byte-order mark; skip them.
            printf '%s' "${ANDROID_KEYSTORE}" | base64 --decode --ignore-garbage > "${RUNNER_TEMP}/release.keystore"
            if check=$(keytool -list -keystore "${RUNNER_TEMP}/release.keystore" -storepass:env UVE_ANDROID_KEYSTORE_PASSWORD 2>&1); then
              signing=(--keystore "${RUNNER_TEMP}/release.keystore")
            else
              # keytool's own reason (wrong password, not a keystore, ...) and the decoded size; no secret.
              reason=$(printf '%s\n' "${check}" | grep -i 'error' | tail -n 1)
              size=$(wc -c < "${RUNNER_TEMP}/release.keystore")
              message="The ANDROID_KEYSTORE secret (${size} bytes once decoded) is not a keystore that ANDROID_KEYSTORE_PASSWORD opens: ${reason}. Paste the base64 of the .keystore/.jks file again, and check the password."
              if [ "${PUBLIC_RELEASE}" = "true" ]; then
                echo "::error::${message}"
                exit 1
              fi
              echo "::warning::${message} This build is signed with a debug key."
            fi
          elif [ "${PUBLIC_RELEASE}" = "true" ]; then
            echo "::error::A public release needs the ANDROID_KEYSTORE secret, so installed copies can update."
            exit 1
          else
            echo "::warning::ANDROID_KEYSTORE is not set: the APK is signed with a throwaway debug key, so it cannot update an installed copy."
          fi
          python3 Engine/Tools/android/build_apk.py --sdk "${ANDROID_HOME}" --app hub --build-dir build/android "${signing[@]}"
          rm -f "${RUNNER_TEMP}/release.keystore"
          ccache -s
      - name: Save the compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .ccache
            .uvbt/tp_lib/Android
            ThirdParty/android
          key: android-hub-${{ hashFiles('Engine/Tools/UVBT/uvbt.py') }}-${{ github.sha }}
      # The Hub and an ABI-matching x86_64 engine package are tested together on the emulator so
      # in-process dlopen, ELF isolation and Android 14 read-only library loading are proven end to end.
      - name: Build the Hub APK and engine package for the emulator
        run: |
          set -euo pipefail
          python3 Engine/Tools/android/build_apk.py --sdk "${ANDROID_HOME}" --app hub --abi "${EMULATOR_ABI}" \
            --debuggable --build-dir build/android-emulator
          UVBT_ANDROID_ABI="${EMULATOR_ABI}" ./uvbt build UniVexEditorAndroid Android Release -j"$(nproc)"
          engine_tag=$(python3 -c "import sys; sys.path.insert(0, 'Engine/Tools/android'); import build_apk; M,m,p,b = build_apk.read_source_version('runtime'); print(f'v{M}.{m}.{p}+build.{b}-beta')")
          python3 Engine/Tools/package_engine.py --bin ".uvbt/bin/Android/${EMULATOR_ABI}/Release" \
            --target "android-${EMULATOR_ABI}" --tag "${engine_tag}" --skip-version-check \
            --output build/android-emulator-pkg
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start the Hub and Editor on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.EMULATOR_API_LEVEL }}
          arch: ${{ env.EMULATOR_ABI }}
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            python3 Engine/Tools/android/smoke_hub.py --adb adb --serial emulator-5554 --apk "build/android-emulator/UniVexHub-${EMULATOR_ABI}.apk" --engine-package build/android-emulator-pkg/univex-engine-*-android-${EMULATOR_ABI}.uvpackage
      - name: Hand the release files to the publish job
        if: env.IS_RELEASE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: hub-android
          path: build/android/UniVexHub-*.apk
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------------------------
  # Release / <platform>: the engine (editor, runtime, packer) in Release. Built on every push;
  # packaged as univex-engine-<version>-<platform>.uvpackage on every run and published on release.
  # ---------------------------------------------------------------------------------------------
  release-linux:
    name: Release / Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      release-tag: ${{ steps.package.outputs.release-tag }}
    env:
      UVBT_COMPILER_LAUNCHER: ccache
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 3G
    steps:
      - uses: actions/checkout@v5
      - name: Restore the compiler cache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-linux-Release-${{ github.sha }}
          restore-keys: ccache-linux-Release-
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libglfw3-dev libglew-dev libgl1-mesa-dev \
            libglu1-mesa-dev zlib1g-dev libjpeg-dev libfreetype-dev libcurl4-openssl-dev patchelf xvfb ccache
      - name: Build
        run: |
          set -euo pipefail
          ccache -z
          for target in UniVexEditor UniVexRuntime UniVexPack UniVexAssetWorkload; do
            ./uvbt build "$target" Linux Release -j"$(nproc)"
          done
          ccache -s
      - name: Save the compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-linux-Release-${{ github.sha }}
      - name: Package the engine
        id: package
        run: |
          set -euo pipefail
          bin=.uvbt/bin/Linux/Release
          # A tag names its version; a master or PR build uses the built engine version.
          tag="${GITHUB_REF_NAME}"
          [ "${GITHUB_REF_TYPE}" = "tag" ] || tag="v$("$bin/uve_editor" --version)-beta"
          python3 Engine/Tools/package_engine.py --bin "$bin" --target linux --tag "${tag}" --output dist
          echo "release-tag=${tag}" >> "${GITHUB_OUTPUT}"
      - name: Verify extracted Linux engine package
        run: |
          set -euo pipefail
          pkg=$(ls dist/univex-engine-*-linux.uvpackage)
          extract="${RUNNER_TEMP}/linux-engine-extracted"
          rm -rf "${extract}" && mkdir -p "${extract}"
          tar -xzf "${pkg}" -C "${extract}"
          for exe in uve_editor uve_runtime uve_pack; do
            ldd "${extract}/${exe}" | tee "/tmp/ldd-${exe}.txt"
            if grep -q 'not found' "/tmp/ldd-${exe}.txt"; then
              echo "::error::Extracted ${exe} has unresolved shared libraries."
              exit 1
            fi
          done
          test -d "${extract}/shaders"
          test -d "${extract}/prism_assets"
          "${extract}/uve_editor" --bridge-stdio < /dev/null
          .uvbt/bin/Linux/Release/uve_asset_workload --create-fixture "${RUNNER_TEMP}/cook-src"
          "${extract}/uve_pack" --project "${RUNNER_TEMP}/cook-src/sample.uvproject" \
            --runtime "${extract}/uve_runtime" --output "${RUNNER_TEMP}/cooked"
          rm -rf "${RUNNER_TEMP}/cook-src"
          "${RUNNER_TEMP}/cooked/uve_runtime" --headless --project "${RUNNER_TEMP}/cooked/sample.uvproject" --frames 3
      - name: Hand the release files to the publish job
        if: env.IS_RELEASE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # Built as an actual Windows application; the staged editor is started once with a cooked project
  # so the DLLs beside it are proven to be the ones it needs. A cold MinGW build takes about an hour;
  # with the compiler cache warm it is minutes.
  release-windows:
    name: Release / Windows
    runs-on: windows-latest
    # Windows minutes count double and Android builds and the emulator are long: a pull request is
    # checked on Linux, and these run on master, version tags and by hand.
    if: github.event_name != 'pull_request'
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-glfw
            mingw-w64-ucrt-x86_64-glew
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-libjpeg-turbo
            mingw-w64-ucrt-x86_64-freetype
            mingw-w64-ucrt-x86_64-ccache
      - name: Restore the compiler cache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-windows-release-${{ github.sha }}
          restore-keys: ccache-windows-release-
      - name: Build
        shell: msys2 {0}
        env:
          UVBT_COMPILER_LAUNCHER: ccache
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_COMPILERCHECK: content
          CCACHE_MAXSIZE: 3G
        run: |
          set -euo pipefail
          ccache -z
          for target in UniVexEditor UniVexRuntime UniVexPack UniVexAssetWorkload UniVexPrismTests; do
            ./uvbt build "$target" Windows Release -j4
          done
          ccache -s
      - name: Save the compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-windows-release-${{ github.sha }}
      - name: Package editor and runtime DLLs
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p package/UniVex-Editor/Content/Viewport
          cp .uvbt/bin/Windows/Release/uve_editor.exe package/UniVex-Editor/
          cp .uvbt/bin/Windows/Release/uve_runtime.exe package/UniVex-Editor/
          cp .uvbt/bin/Windows/Release/uve_pack.exe package/UniVex-Editor/
          cp .uvbt/bin/Windows/Release/uve_asset_workload.exe package/UniVex-Editor/
          cp -r .uvbt/bin/Windows/Release/prism_assets package/UniVex-Editor/
          cp -r Engine/Runtime/RHI/Shader/built_in package/UniVex-Editor/shaders
          python - <<'PY'
          import pathlib
          import re
          import shutil
          import subprocess
          destination = pathlib.Path('package/UniVex-Editor')
          pending = list(destination.glob('*.exe'))
          copied = set()
          while pending:
              binary = pending.pop()
              imports = subprocess.check_output(['objdump', '-p', str(binary)], text=True)
              for name in re.findall(r'DLL Name:\s*(\S+)', imports):
                  key = name.lower()
                  source = pathlib.Path(shutil.which('g++')).parent / name
                  if key in copied or not source.is_file():
                      continue
                  copied.add(key)
                  target = destination / name
                  shutil.copy2(source, target)
                  pending.append(target)
          PY
          printf '@echo off\r\nstart "" /D "%%~dp0" "%%~dp0uve_editor.exe"\r\n' > package/UniVex-Editor/Start-Editor.bat
      - name: PRISM UI tests
        shell: msys2 {0}
        run: ./.uvbt/bin/Windows/Release/uve_prism_tests.exe Engine/Runtime/Prism/assets
      - name: Verify executable starts
        shell: msys2 {0}
        run: |
          cd package/UniVex-Editor
          objdump -p ./uve_editor.exe | grep -q 'Subsystem.*Windows GUI'
          objdump -p ./uve_runtime.exe | grep -q 'Subsystem.*Windows GUI'
          objdump -p ./uve_pack.exe | grep -q 'Subsystem.*Windows CUI'
          ./uve_editor.exe --bridge-stdio < /dev/null
          ./uve_asset_workload.exe --create-fixture ../cook-source
          ./uve_pack.exe --project ../cook-source/sample.uvproject --runtime ./uve_runtime.exe --output ../cooked --cook windows
          mv ../cook-source ../source-unavailable
          ../cooked/uve_runtime.exe --headless --project ../cooked/sample.uvproject --frames 3
      - name: Package the engine
        if: env.IS_RELEASE == 'true'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          bin=.uvbt/bin/Windows/Release
          tag="${GITHUB_REF_NAME}"
          [ "${GITHUB_REF_TYPE}" = "tag" ] || tag="v$("$bin/uve_editor.exe" --version | tr -d '\r')-beta"
          python Engine/Tools/package_engine.py --bin "$bin" --target windows --tag "${tag}" --output dist
      - name: Hand the release files to the publish job
        if: env.IS_RELEASE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # Builds the Android engine (runtime + in-process Hub editor) for arm64-v8a and x86_64, verifies
  # ELF symbol isolation, and stages both ABI builds for ABI-aware .uvpackage packaging.
  release-android:
    name: Release / Android
    runs-on: ubuntu-latest
    # Windows minutes count double and Android builds and the emulator are long: a pull request is
    # checked on Linux, and these run on master, version tags and by hand.
    if: github.event_name != 'pull_request'
    timeout-minutes: 120
    env:
      UVBT_COMPILER_LAUNCHER: ccache
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 3G
    steps:
      - uses: actions/checkout@v5
      - name: Restore the compiler cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .ccache
            .uvbt/tp_lib/Android
            ThirdParty/android
          key: android-engine-${{ hashFiles('Engine/Tools/UVBT/uvbt.py') }}-${{ github.sha }}
          restore-keys: android-engine-${{ hashFiles('Engine/Tools/UVBT/uvbt.py') }}-
      - name: Install the Android SDK pieces
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build ccache
          packages=$(python3 - <<'PY'
          import sys
          sys.path.insert(0, "Engine/Tools/android")
          import build_apk
          print(f"ndk;{build_apk.uvbt.ANDROID_NDK_VERSION} build-tools;{build_apk.ANDROID_BUILD_TOOLS} "
                f"platforms;{build_apk.ANDROID_PLATFORM}")
          PY
          )
          # `yes` ends with a broken pipe once the licenses are accepted; that is not a failure.
          (yes || true) | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ${packages}
      - name: Build Android arm64-v8a and x86_64
        run: |
          set -euo pipefail
          ccache -z
          for abi in arm64-v8a x86_64; do
            UVBT_ANDROID_ABI="${abi}" ./uvbt build UniVexAndroid Android Release -j"$(nproc)"
            UVBT_ANDROID_ABI="${abi}" ./uvbt build UniVexEditorAndroid Android Release -j"$(nproc)"
          done
          ccache -s
      - name: Save the compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .ccache
            .uvbt/tp_lib/Android
            ThirdParty/android
          key: android-engine-${{ hashFiles('Engine/Tools/UVBT/uvbt.py') }}-${{ github.sha }}
      - name: Verify Android ELF symbol isolation and stage ABI builds
        run: |
          set -euo pipefail
          read -r ndk host <<< "$(python3 -c "import sys; sys.path.insert(0, 'Engine/Tools/UVBT'); import uvbt; print(uvbt.ANDROID_NDK_VERSION, uvbt.ANDROID_NDK_HOST_TAG)")"
          ndk_bin="${ANDROID_HOME}/ndk/${ndk}/toolchains/llvm/prebuilt/${host}/bin"
          read -r editor_lib runtime_lib <<< "$(python3 -c "import sys; sys.path.insert(0, 'Engine/Tools'); import package_engine; print(package_engine.ANDROID_EDITOR_LIBRARY, package_engine.ANDROID_RUNTIME_LIBRARY)")"
          for abi in arm64-v8a x86_64; do
            bin=".uvbt/bin/Android/${abi}/Release"
            stage="build/android-editor/${abi}"
            mkdir -p "${stage}"
            cp "${bin}/${editor_lib}" "${bin}/${runtime_lib}" "${stage}/"
            cp -r "${bin}/prism_assets" "${stage}/"
            "${ndk_bin}/llvm-strip" --strip-unneeded "${stage}/${editor_lib}" "${stage}/${runtime_lib}"
            # Verify ELF symbol isolation: only entry points are exported dynamically.
            exported=$("${ndk_bin}/llvm-nm" -D --defined-only "${stage}/${editor_lib}" | awk '{print $3}')
            echo "Exported symbols in ${abi}/${editor_lib}: ${exported}"
            if ! printf '%s\n' "${exported}" | grep -qx 'UveEditorRunUVE'; then
              echo "::error::${abi}/${editor_lib} does not export UveEditorRunUVE."
              exit 1
            fi
            unexpected=$(printf '%s\n' "${exported}" | grep -Ev '^(UveEditorRunUVE|ANativeActivity_onCreate|_edata|_end|__bss_start)$' || true)
            if [ -n "${unexpected}" ]; then
              echo "::error::${abi}/${editor_lib} leaks unexpected dynamic symbols: ${unexpected}"
              exit 1
            fi
            engine_tag=$(python3 -c "import sys; sys.path.insert(0, 'Engine/Tools/android'); import build_apk; M,m,p,b = build_apk.read_source_version('runtime'); print(f'v{M}.{m}.{p}+build.{b}-beta')")
            python3 Engine/Tools/package_engine.py --bin "${stage}" --target "android-${abi}" \
              --tag "${engine_tag}" --skip-version-check --require-runtime --output "${RUNNER_TEMP}/android-verify"
          done
      - name: Hand the Android builds to the publish job
        if: env.IS_RELEASE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-editor-build
          path: build/android-editor/
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------------------------
  # Release only: one GitHub Release, once the tests passed and every platform is packaged.
  # ---------------------------------------------------------------------------------------------
  publish:
    name: Publish the release
    if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || startsWith(github.ref, 'refs/tags/v')
    needs: [linux, hub-linux, hub-windows, hub-android, release-linux, release-windows, release-android]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            ${{ env.ENGINE_FEED_FILE }}
            Engine/Tools
            Engine/Runtime/RHI/Shader/built_in
          sparse-checkout-cone-mode: false
      - name: Choose the releases repository
        env:
          PUBLISH_RELEASES: ${{ vars.PUBLISH_RELEASES }}
        run: |
          set -euo pipefail
          # Only a version tag reaches the public repository; master builds stay in development.
          if [ "${PUBLISH_RELEASES}" = "true" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            repository=$(jq -er '.owner + "/" + .repository' "${ENGINE_FEED_FILE}")
          elif [ -n "${DEV_RELEASES_REPOSITORY}" ]; then
            repository="${DEV_RELEASES_REPOSITORY}"
          else
            echo "::error::PUBLISH_RELEASES is off and DEV_RELEASES_REPOSITORY is empty; name the development repository."
            exit 1
          fi
          echo "RELEASES_REPOSITORY=${repository}" >> "${GITHUB_ENV}"
          echo "Publishing to ${repository}"
      - name: Collect the release files
        uses: actions/download-artifact@v4
        with:
          pattern: "{release,hub}-*"
          path: dist
          merge-multiple: true
      - name: Collect the Android engine builds
        uses: actions/download-artifact@v4
        with:
          name: android-editor-build
          path: build/android-editor
      - name: Package the engine for Android (arm64-v8a and x86_64)
        run: |
          set -euo pipefail
          for abi in arm64-v8a x86_64; do
            python3 Engine/Tools/package_engine.py --bin "build/android-editor/${abi}" --target "android-${abi}" \
              --tag "${{ needs.release-linux.outputs.release-tag }}" --skip-version-check --require-runtime --output dist
          done
      - name: Name the APK after the Hub's version
        env:
          HUB_VERSION: ${{ needs.hub-linux.outputs.hub-version }}
        run: |
          set -euo pipefail
          display=$(python3 -c "import sys; sys.path.insert(0, 'Engine/Tools'); import package_engine; print(package_engine.display_version(sys.argv[1]))" "${HUB_VERSION}")
          for apk in dist/UniVexHub-*.apk; do
            abi=$(basename "${apk}" .apk); abi=${abi#UniVexHub-}
            named="dist/UniVexHub-${display}-android-${abi}.apk"
            mv "${apk}" "${named}"
            (cd dist && sha256sum "$(basename "${named}")" > "$(basename "${named}").sha256")
          done
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          RELEASE_TAG="${{ needs.release-linux.outputs.release-tag }}"
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::The RELEASES_TOKEN secret is not set; it needs Contents: write on ${RELEASES_REPOSITORY}."
            exit 1
          fi
          title="UniVex ${RELEASE_TAG#v}"
          # Running a release again replaces its files instead of failing on the existing tag.
          if gh release view "${RELEASE_TAG}" --repo "${RELEASES_REPOSITORY}" > /dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" dist/* --repo "${RELEASES_REPOSITORY}" --clobber
          else
            flags=(--repo "${RELEASES_REPOSITORY}" --title "${title}" --notes "${title}")
            case "${RELEASE_TAG}" in
              *-beta) flags+=(--prerelease) ;;
            esac
            gh release create "${RELEASE_TAG}" "${flags[@]}" dist/*
          fi
      # Only once published: if publishing fails the builds stay downloadable from this run.
      - name: Remove the hand-over artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ids=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '.artifacts[].id')
          for id in ${ids}; do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}"
          done
