#
# Publishes UniVex releases. Engines and the Hub are released separately:
#
#   v0.2.0, v0.2.0-beta   An engine version. Built on Linux and Windows, checked against the version
#                         the editor reports, packaged with Engine/Tools/package_engine.py and
#                         attached with checksums to a GitHub Release. Beta tags become prereleases,
#                         the Hub's Beta channel. Hubs that are online list the new version on their
#                         next check; offline ones keep the engines they have.
#   hub-v0.1.0            A Hub version. The single-file installers (Engine/Tools/make_hub_installer.py)
#                         carry the Hub alone; users download engines from it.
#
# Where a release goes is switched by the PUBLISH_RELEASES repository variable:
#
#   not "true" (default)  Development builds go to the private repository in DEV_RELEASES_REPOSITORY
#                         below (a repository variable of the same name overrides it). Nothing
#                         reaches the public.
#   "true"                Releases go to the public repository that Engine/Distribution/engine_feed.json
#                         names, the same file the Hub reads (without credentials) to find them.
#
# The private repository's name lives only in this workflow, never in code the Hub ships. Publishing
# needs the RELEASES_TOKEN secret: a fine-grained access token with Contents: write on those two
# repositories only. It lives in this repository's secrets and is never part of any build.

name: Release

on:
  push:
    tags: ['v*', 'hub-v*']
    # The same release from a branch named release/<tag> (e.g. release/v0.2.0-beta), for setups that
    # can push branches but not tags. The tag is the branch name without "release/".
    branches: ['release/v*', 'release/hub-v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  ENGINE_FEED_FILE: Engine/Distribution/engine_feed.json
  DEV_RELEASES_REPOSITORY: ${{ vars.DEV_RELEASES_REPOSITORY || 'UniVexStudio/UniVexReleases-Dev' }}
  LINUX_PACKAGES: >-
    ninja-build libglfw3-dev libglew-dev libgl1-mesa-dev libglu1-mesa-dev zlib1g-dev
    libjpeg-dev libfreetype-dev libcurl4-openssl-dev xvfb

jobs:
  linux:
    name: Linux build
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${LINUX_PACKAGES}
      - name: Build and package the engine
        if: startsWith(github.ref_name, 'v') || startsWith(github.ref_name, 'release/v')
        run: |
          set -euo pipefail
          RELEASE_TAG="${GITHUB_REF_NAME#release/}"
          for target in UniVexEditor UniVexRuntime UniVexPack; do
            ./uvbt build "$target" Linux Release -j"$(nproc)"
          done
          python3 Engine/Tools/package_engine.py --bin .uvbt/bin/Linux/Release --target linux \
            --tag "${RELEASE_TAG}" --output dist
      - name: Build the Hub installer
        if: startsWith(github.ref_name, 'hub-v') || startsWith(github.ref_name, 'release/hub-v')
        run: |
          set -euo pipefail
          RELEASE_TAG="${GITHUB_REF_NAME#release/}"
          for target in UniVexHub UniVexHubSetup; do
            ./uvbt build "$target" Linux Release -j"$(nproc)"
          done
          python3 Engine/Tools/make_hub_installer.py --bin .uvbt/bin/Linux/Release --target linux \
            --tag "${RELEASE_TAG}" --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: dist/
          if-no-files-found: error
          # Only carries the files to the publish job; deleted once the release is published.
          retention-days: 7

  windows:
    name: Windows build
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-glfw
            mingw-w64-ucrt-x86_64-glew
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-libjpeg-turbo
            mingw-w64-ucrt-x86_64-freetype
      - name: Build and package the engine
        if: startsWith(github.ref_name, 'v') || startsWith(github.ref_name, 'release/v')
        shell: msys2 {0}
        run: |
          set -euo pipefail
          RELEASE_TAG="${GITHUB_REF_NAME#release/}"
          for target in UniVexEditor UniVexRuntime UniVexPack; do
            ./uvbt build "$target" Windows Release -j4
          done
          python Engine/Tools/package_engine.py --bin .uvbt/bin/Windows/Release --target windows \
            --tag "${RELEASE_TAG}" --output dist
      - name: Build the Hub installer
        if: startsWith(github.ref_name, 'hub-v') || startsWith(github.ref_name, 'release/hub-v')
        shell: msys2 {0}
        run: |
          set -euo pipefail
          RELEASE_TAG="${GITHUB_REF_NAME#release/}"
          for target in UniVexHub UniVexHubSetup; do
            ./uvbt build "$target" Windows Release -j4
          done
          python Engine/Tools/make_hub_installer.py --bin .uvbt/bin/Windows/Release --target windows \
            --tag "${RELEASE_TAG}" --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/
          if-no-files-found: error
          # Only carries the files to the publish job; deleted once the release is published.
          retention-days: 7

  publish:
    name: Publish the release
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: ${{ env.ENGINE_FEED_FILE }}
          sparse-checkout-cone-mode: false
      - name: Choose the releases repository
        env:
          PUBLISH_RELEASES: ${{ vars.PUBLISH_RELEASES }}
        run: |
          set -euo pipefail
          if [ "${PUBLISH_RELEASES}" = "true" ]; then
            repository=$(jq -er '.owner + "/" + .repository' "${ENGINE_FEED_FILE}")
          elif [ -n "${DEV_RELEASES_REPOSITORY}" ]; then
            repository="${DEV_RELEASES_REPOSITORY}"
          else
            echo "::error::PUBLISH_RELEASES is off and DEV_RELEASES_REPOSITORY is empty; name the private repository for development builds."
            exit 1
          fi
          echo "RELEASES_REPOSITORY=${repository}" >> "${GITHUB_ENV}"
          echo "Publishing to ${repository}"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          RELEASE_TAG="${GITHUB_REF_NAME#release/}"
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::The RELEASES_TOKEN secret is not set; it needs Contents: write on ${RELEASES_REPOSITORY}."
            exit 1
          fi
          case "${RELEASE_TAG}" in
            hub-v*) title="UniVex Hub ${RELEASE_TAG#hub-v}" ;;
            *)      title="UniVex Engine ${RELEASE_TAG#v}" ;;
          esac
          flags=(--repo "${RELEASES_REPOSITORY}" --title "${title}" --notes "${title}")
          case "${RELEASE_TAG}" in
            *-beta) flags+=(--prerelease) ;;
          esac
          gh release create "${RELEASE_TAG}" "${flags[@]}" dist/*
      # Only once published: if publishing fails the builds stay downloadable from this run.
      - name: Remove the hand-over artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ids=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '.artifacts[].id')
          for id in ${ids}; do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}"
          done
